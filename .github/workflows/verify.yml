name: verify

# Runs ./verify.sh quick on every push: the self-test of the S3 code and every figure and claim
# check that works from the stored data. The same command runs locally, see environment/README.md.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # pdftoppm renders Fig. 7 for its pixel comparison with the paper's figure.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install the pinned packages
        run: |
          python -m venv .venv
          .venv/bin/pip install -r environment/requirements.txt

      - name: Verify
        run: ./verify.sh quick
